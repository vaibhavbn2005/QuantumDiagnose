<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuantumDiagnose</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="background"></div>

<main class="container">

    <!-- ================= HEADER ================= -->

    <header class="hero">

        <div class="logo">Q</div>

        <div class="brand">
            <h1>QuantumDiagnose</h1>
            <p>Machine-learning based symptom analysis</p>
        </div>

        <span class="badge">ML Prototype</span>

        <div class="auth-buttons">

            <button id="loginBtn"
                    class="secondary">
                Login
            </button>

            <button id="signupBtn"
                    class="primary">
                Sign Up
            </button>

            <button id="logoutBtn"
                    class="secondary hidden">
                Logout
            </button>

        </div>

    </header>


    <!-- ================= SYMPTOMS ================= -->

    <section class="card">

        <div class="section-head">

            <div>
                <h2>Enter symptoms</h2>

                <p>
                    Select the symptoms reported by the patient.
                </p>
            </div>

            <button id="clearBtn"
                    class="secondary">
                Clear
            </button>

        </div>


        <div class="search-wrap">

            <input
                id="search"
                type="search"
                placeholder="Search symptoms...">

        </div>


        <div id="symptomGrid"
             class="symptom-grid">

            {% for symptom in symptoms %}

            <label
                class="symptom"
                data-name="{{ symptom|replace('_', ' ')|lower }}">

                <input
                    type="checkbox"
                    value="{{ symptom }}">

                <span>
                    {{ symptom|replace('_', ' ')|title }}
                </span>

            </label>

            {% endfor %}

        </div>


        <div class="selected-line">

            <span>
                <strong id="count">0</strong>
                symptoms selected
            </span>

            <button id="predictBtn"
                    class="primary">
                Predict Possible Disease
            </button>

        </div>

    </section>


    <!-- ================= RESULT ================= -->

    <section id="result"
             class="card result hidden">

        <div class="result-label">
            Prediction
        </div>

        <h2 id="disease">
            —
        </h2>

        <div class="confidence-bar">
            <span id="confidenceBar"></span>
        </div>

        <p id="confidenceText"></p>

        <h3>Top Predictions</h3>

        <div id="topPredictions"
             class="top-list">
        </div>

        <p id="message"
           class="disclaimer">
        </p>

    </section>


    <!-- ================= AUTH MODAL ================= -->

    <div id="authModal"
         class="modal hidden">

        <div class="modal-content">

            <button id="closeModal"
                    class="close-btn">
                ×
            </button>

            <h2 id="authTitle">
                Login
            </h2>


            <!-- Authentication method -->

            <div class="auth-tabs">

                <button id="emailTab"
                        class="auth-tab active">
                    Email
                </button>

                <button id="phoneTab"
                        class="auth-tab">
                    Phone
                </button>

            </div>


            <!-- EMAIL AUTH -->

            <div id="emailAuth">

                <input
                    id="authEmail"
                    type="email"
                    placeholder="Email">

                <input
                    id="authPassword"
                    type="password"
                    placeholder="Password">

                <button id="authSubmit"
                        class="primary">
                    Login
                </button>

            </div>


            <!-- PHONE AUTH -->

            <div id="phoneAuth"
                 class="hidden">

                <input
                    id="phoneNumber"
                    type="tel"
                    placeholder="+91XXXXXXXXXX">

                <div id="recaptcha-container"></div>

                <button id="sendOtpBtn"
                        class="primary">
                    Send OTP
                </button>

                <input
                    id="otpCode"
                    type="text"
                    placeholder="Enter OTP"
                    maxlength="6">

                <button id="verifyOtpBtn"
                        class="primary">
                    Verify OTP
                </button>

            </div>


            <p id="authMessage"></p>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        <span>
            QuantumDiagnose • Educational project
        </span>

        <a href="/health"
           target="_blank">
            System status
        </a>

    </footer>

</main>


<!-- ==================================================
     FIREBASE + APPLICATION JAVASCRIPT
     IMPORTANT: THIS IS THE ONLY SCRIPT TAG NEEDED
     ================================================== -->

<script type="module"
        src="{{ url_for('static', filename='script.js') }}">
</script>

</body>
</html>
