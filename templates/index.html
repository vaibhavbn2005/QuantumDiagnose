<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuantumDiagnose</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: white;
            border-radius: 28px;
            padding: 45px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: #3561f5;
            border-radius: 28px;
            margin: 0 auto 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 62px;
            font-weight: bold;
        }

        h1 {
            color: #172033;
            font-size: 48px;
            margin-bottom: 18px;
        }

        .subtitle {
            color: #687386;
            font-size: 25px;
            margin-bottom: 40px;
        }

        .tabs {
            display: flex;
            background: #f1f2f5;
            border-radius: 22px;
            padding: 7px;
            margin-bottom: 28px;
        }

        .tab {
            width: 50%;
            padding: 20px;
            border: none;
            background: transparent;
            border-radius: 17px;
            font-size: 25px;
            color: #697284;
            cursor: pointer;
        }

        .tab.active {
            background: white;
            color: #172033;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        .input {
            width: 100%;
            padding: 22px 28px;
            margin-bottom: 20px;
            border: 1px solid #dce1e9;
            border-radius: 20px;
            font-size: 21px;
            outline: none;
        }

        .input:focus {
            border-color: #3561f5;
            box-shadow: 0 0 0 3px rgba(53, 97, 245, 0.1);
        }

        .button {
            width: 100%;
            padding: 22px;
            margin-top: 5px;
            border: none;
            border-radius: 20px;
            background: #3561f5;
            color: white;
            font-size: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover {
            background: #294fd5;
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-size: 17px;
            min-height: 25px;
            color: #d32f2f;
        }

        .success {
            color: #16803c !important;
        }

        @media (max-width: 600px) {

            .container {
                padding: 35px 20px;
            }

            .logo {
                width: 85px;
                height: 85px;
                font-size: 52px;
            }

            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 20px;
            }

            .tab {
                font-size: 20px;
                padding: 17px 10px;
            }

            .input {
                font-size: 17px;
            }

            .button {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Logo -->
        <div class="logo">
            Q
        </div>

        <!-- Title -->
        <h1>QuantumDiagnose</h1>

        <p class="subtitle">
            Intelligent symptom analysis platform
        </p>

        <!-- Login / Signup Tabs -->
        <div class="tabs">

            <button
                id="loginTab"
                class="tab active"
                type="button">
                Login
            </button>

            <button
                id="signupTab"
                class="tab"
                type="button">
                Sign Up
            </button>

        </div>

        <!-- Email -->
        <input
            id="email"
            class="input"
            type="email"
            placeholder="Enter your email"
            autocomplete="email">

        <!-- Password -->
        <input
            id="password"
            class="input"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password">

        <!-- Main Button -->
        <button
            id="actionButton"
            class="button"
            type="button">
            Login
        </button>

        <!-- Firebase Message -->
        <div id="message"></div>

    </div>

    <!-- IMPORTANT: type="module" -->
    <script type="module" src="./script.js"></script>

</body>

</html>
