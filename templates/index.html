<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuantumDiagnose</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app-container">

    <!-- ================= AUTH SECTION ================= -->
    <div id="authSection">

        <div class="logo">
            <span>Q</span>
        </div>

        <h1>QuantumDiagnose</h1>
        <p class="subtitle">Intelligent symptom analysis platform</p>

        <!-- LOGIN / SIGNUP TABS -->
        <div class="tabs">

            <button id="loginTab"
                    class="tab active"
                    type="button">
                Login
            </button>

            <button id="signupTab"
                    class="tab"
                    type="button">
                Sign Up
            </button>

        </div>

        <!-- EMAIL -->
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
        >

        <!-- PASSWORD -->
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >

        <!-- LOGIN BUTTON -->
        <button
            id="loginButton"
            class="main-button"
            type="button">
            Login
        </button>

        <!-- SIGNUP BUTTON -->
        <button
            id="signupButton"
            class="main-button hidden"
            type="button">
            Create Account
        </button>

        <p id="message"></p>

    </div>


    <!-- ================= DASHBOARD ================= -->
    <div id="dashboardSection" class="hidden">

        <div class="dashboard-header">

            <div>
                <h1>QuantumDiagnose</h1>
                <p>Welcome to your health analysis dashboard</p>
            </div>

            <button
                id="logoutButton"
                class="logout-button"
                type="button">
                Logout
            </button>

        </div>


        <!-- USER INFORMATION -->
        <div class="welcome-card">

            <h2>Welcome 👋</h2>

            <p id="userEmail"></p>

            <p>
                Your account has been successfully authenticated.
            </p>

        </div>


        <!-- SYMPTOM ANALYSIS -->
        <div class="analysis-card">

            <h2>Symptom Analysis</h2>

            <p>
                Enter your symptoms below to begin your analysis.
            </p>

            <textarea
                id="symptoms"
                placeholder="Example: headache, fever, tiredness..."
                rows="6">
            </textarea>

            <button
                id="analyzeButton"
                class="main-button"
                type="button">
                Analyze Symptoms
            </button>

            <div id="analysisResult" class="result-box hidden"></div>

        </div>

    </div>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module"
        src="{{ url_for('static', filename='script.js') }}">
</script>

</body>
</html>
