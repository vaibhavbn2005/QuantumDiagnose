<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuantumDiagnose</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="background"></div>

<main class="container">

    <!-- ================= HEADER ================= -->

    <header class="hero">

        <div class="logo">Q</div>

        <div class="brand">
            <h1>QuantumDiagnose</h1>
            <p>Machine-learning based symptom analysis</p>
        </div>

        <span class="badge">ML Prototype</span>

        <div class="auth-buttons">

            <button id="loginBtn"
                    class="secondary">
                Login
            </button>

            <button id="signupBtn"
                    class="primary">
                Sign Up
            </button>

            <button id="logoutBtn"
                    class="secondary hidden">
                Logout
            </button>

        </div>

    </header>


    <!-- ================= SYMPTOMS ================= -->

    <section class="card">

        <div class="section-head">

            <div>
                <h2>Enter symptoms</h2>

                <p>
                    Select the symptoms reported by the patient.
                </p>
            </div>

            <button id="clearBtn"
                    class="secondary">
                Clear
            </button>

        </div>


        <!-- Search -->

        <div class="search-wrap">

            <input
                id="search"
                type="search"
                placeholder="Search symptoms...">

        </div>


        <!-- Symptoms -->

        <div id="symptomGrid"
             class="symptom-grid">

            {% for symptom in symptoms %}

            <label
                class="symptom"
                data-name="{{ symptom|replace('_', ' ')|lower }}">

                <input
                    type="checkbox"
                    value="{{ symptom }}">

                <span>
                    {{ symptom|replace('_', ' ')|title }}
                </span>

            </label>

            {% endfor %}

        </div>


        <!-- Selected count + prediction -->

        <div class="selected-line">

            <span>
                <strong id="count">0</strong>
                symptoms selected
            </span>

            <button id="predictBtn"
                    class="primary">
                Predict Possible Disease
            </button>

        </div>

    </section>


    <!-- ================= RESULT ================= -->

    <section id="result"
             class="card result hidden">

        <div class="result-label">
            Prediction
        </div>

        <h2 id="disease">
            —
        </h2>

        <div class="confidence-bar">
            <span id="confidenceBar"></span>
        </div>

        <p id="confidenceText"></p>

        <h3>
            Top Predictions
        </h3>

        <div id="topPredictions"
             class="top-list">
        </div>

        <p id="message"
           class="disclaimer">
        </p>

    </section>


    <!-- ================= AUTH MODAL ================= -->

    <div id="authModal"
         class="modal hidden">

        <div class="modal-content">

            <!-- Close -->

            <button id="closeModal"
                    class="close-btn">
                ×
            </button>


            <!-- Title -->

            <h2 id="authTitle">
                Login
            </h2>


            <!-- ================= EMAIL AUTH ================= -->

            <div id="emailAuth">

                <input
                    id="authEmail"
                    type="email"
                    placeholder="Email"
                    autocomplete="email">


                <input
                    id="authPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password">


                <button id="authSubmit"
                        class="primary">
                    Login
                </button>

            </div>


            <!-- Authentication message -->

            <p id="authMessage"></p>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        <span>
            QuantumDiagnose • Educational project
        </span>

        <a href="/health"
           target="_blank">
            System status
        </a>

    </footer>

</main>


<!-- ==================================================
     APPLICATION JAVASCRIPT
     ================================================== -->

<script type="module"
        src="{{ url_for('static', filename='script.js') }}">
</script>

</body>
</html>
