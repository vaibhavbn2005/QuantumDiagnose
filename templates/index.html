<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>QuantumDiagnose</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">


  <style>

    /* =====================================================
       AUTHENTICATION BUTTONS
       ===================================================== */

    .auth-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
    }


    /* =====================================================
       MODAL
       ===================================================== */

    .modal {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.55);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 1000;
    }


    .modal-content {

      width: min(400px, 90%);

      background: white;

      padding: 30px;

      border-radius: 18px;

      position: relative;

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.25);

    }


    .modal-content h2 {

      margin-bottom: 20px;

    }


    .modal-content input {

      width: 100%;

      box-sizing: border-box;

      padding: 12px;

      margin: 8px 0;

      border:
        1px solid #ddd;

      border-radius: 8px;

      font-size: 15px;

    }


    .modal-content .primary {

      width: 100%;

      margin-top: 12px;

    }


    /* =====================================================
       CLOSE BUTTON
       ===================================================== */

    .close-btn {

      position: absolute;

      right: 15px;

      top: 10px;

      border: none;

      background: transparent;

      font-size: 28px;

      cursor: pointer;

    }


    /* =====================================================
       AUTH MESSAGE
       ===================================================== */

    #authMessage {

      margin-top: 15px;

      font-size: 14px;

    }


    /* =====================================================
       HIDDEN
       ===================================================== */

    .hidden {

      display: none !important;

    }


    /* =====================================================
       PHONE AUTH
       ===================================================== */

    #phoneAuthArea {

      margin-top: 15px;

    }


    #phoneAuthArea input {

      width: 100%;

      box-sizing: border-box;

      padding: 12px;

      margin: 8px 0;

      border:
        1px solid #ddd;

      border-radius: 8px;

      font-size: 15px;

    }


    #phoneAuthArea button {

      width: 100%;

      margin-top: 8px;

    }


    #recaptcha-container {

      margin-top: 10px;

    }


    /* =====================================================
       RESPONSIVE DESIGN
       ===================================================== */

    @media (max-width: 800px) {

      .auth-buttons {

        margin-left: 0;

        margin-top: 10px;

      }


      .hero {

        flex-wrap: wrap;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       BACKGROUND
       ===================================================== -->

  <div class="background"></div>


  <main class="container">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="hero">


      <!-- LOGO -->

      <div class="logo">

        Q

      </div>


      <!-- TITLE -->

      <div>

        <h1>
          QuantumDiagnose
        </h1>

        <p>
          Machine-learning based symptom analysis
        </p>

      </div>


      <!-- PROJECT BADGE -->

      <span class="badge">

        ML Prototype

      </span>


      <!-- AUTH BUTTONS -->

      <div class="auth-buttons">


        <button
          id="loginBtn"
          class="secondary">

          Login

        </button>


        <button
          id="signupBtn"
          class="primary">

          Sign Up

        </button>


        <button
          id="logoutBtn"
          class="secondary hidden">

          Logout

        </button>


      </div>


    </header>



    <!-- =====================================================
         SYMPTOM ANALYSIS
         ===================================================== -->

    <section class="card">


      <!-- SECTION HEADER -->

      <div class="section-head">


        <div>

          <h2>
            Enter symptoms
          </h2>

          <p>
            Select the symptoms reported by the patient.
          </p>

        </div>


        <button
          id="clearBtn"
          class="secondary">

          Clear

        </button>


      </div>



      <!-- SEARCH -->

      <div class="search-wrap">

        <input
          id="search"
          type="search"
          placeholder="Search symptoms...">

      </div>



      <!-- =================================================
           SYMPTOM GRID
           ================================================= -->

      <div
        id="symptomGrid"
        class="symptom-grid">


        {% for symptom in symptoms %}


        <label
          class="symptom"
          data-name="{{ symptom|replace('_', ' ') }}">


          <input
            type="checkbox"
            value="{{ symptom }}">


          <span>

            {{ symptom|replace('_', ' ')|title }}

          </span>


        </label>


        {% endfor %}


      </div>



      <!-- =================================================
           SELECTED SYMPTOMS + PREDICT
           ================================================= -->

      <div class="selected-line">


        <span>

          <strong id="count">
            0
          </strong>

          symptoms selected

        </span>


        <button
          id="predictBtn"
          class="primary">

          Predict Possible Disease

        </button>


      </div>


    </section>



    <!-- =====================================================
         PREDICTION RESULT
         ===================================================== -->

    <section
      id="result"
      class="card result hidden">


      <div class="result-label">

        Prediction

      </div>


      <h2 id="disease">

        —

      </h2>


      <!-- CONFIDENCE BAR -->

      <div class="confidence-bar">

        <span
          id="confidenceBar">
        </span>

      </div>


      <p
        id="confidenceText">
      </p>


      <!-- TOP PREDICTIONS -->

      <div
        id="topPredictions"
        class="top-list">
      </div>


      <!-- DISCLAIMER -->

      <p
        class="disclaimer"
        id="message">
      </p>


    </section>



    <!-- =====================================================
         LOGIN / SIGNUP MODAL
         ===================================================== -->

    <div
      id="authModal"
      class="modal hidden">


      <div class="modal-content">


        <!-- CLOSE -->

        <button
          id="closeModal"
          class="close-btn">

          ×

        </button>


        <!-- AUTH TITLE -->

        <h2 id="authTitle">

          Login

        </h2>



        <!-- EMAIL -->

        <input
          id="authEmail"
          type="email"
          placeholder="Email">


        <!-- PASSWORD -->

        <input
          id="authPassword"
          type="password"
          placeholder="Password">


        <!-- EMAIL LOGIN / SIGNUP -->

        <button
          id="authSubmit"
          class="primary">

          Login

        </button>


        <!-- =================================================
             PHONE AUTH AREA
             ================================================= -->

        <div
          id="phoneAuthArea"
          style="display:none;">


          <!-- PHONE -->

          <input
            id="authPhone"
            type="tel"
            placeholder="+919876543210">


          <!-- SEND OTP -->

          <button
            id="sendOTP"
            class="primary">

            Send OTP

          </button>


          <!-- OTP -->

          <input
            id="authOTP"
            type="text"
            placeholder="Enter OTP"
            style="display:none;">


          <!-- VERIFY OTP -->

          <button
            id="verifyOTP"
            class="primary"
            style="display:none;">

            Verify OTP

          </button>


          <!-- FIREBASE RECAPTCHA -->

          <div
            id="recaptcha-container">
          </div>


        </div>



        <!-- AUTH MESSAGE -->

        <p
          id="authMessage">
        </p>


      </div>

    </div>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>


      <span>

        QuantumDiagnose • Educational project

      </span>


      <a
        href="/health"
        target="_blank">

        System status

      </a>


    </footer>


  </main>



  <!-- =====================================================
       FIREBASE + QUANTUMDIAGNOSE JAVASCRIPT
       
       IMPORTANT:
       This MUST be at the bottom of the page.
       ===================================================== -->

  <script
    type="module"
    src="{{ url_for('static', filename='script.js') }}">
  </script>


</body>

</html>
